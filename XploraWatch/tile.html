<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0 !important; height: 100%; overflow: hidden; background: transparent; }
  #xw { position: fixed; inset: 0; container-type: size; overflow: hidden; color: var(--fg); background: var(--bg); font-family: inherit; }
  #xw * { box-sizing: border-box; }
  #xw.vd { --bg: #1d2228; --fg: #e8edf2; --sub: #9aa5b1; --box: rgba(30, 36, 43, .74); --line: rgba(255, 255, 255, .09); --track: rgba(255, 255, 255, .1); --on: #e08a00; }
  #xw.vl { --bg: #ffffff; --fg: #1f2933; --sub: #5b6672; --box: rgba(255, 255, 255, .8); --line: rgba(0, 0, 0, .09); --track: rgba(0, 0, 0, .08); --on: #e08a00; }
  .glass { background: var(--box); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* Live map over the whole tile, faded into the card color behind the content */
  #xmap { position: absolute; inset: 0; background: var(--bg); }
  #xmap .leaflet-top { top: var(--mt); }
  #xmap .leaflet-left { left: calc(var(--ms) - 10px); }
  #xmap .leaflet-control-attribution { background: transparent; color: var(--sub); font-size: 9px; }
  #xmap .leaflet-control-attribution a { color: var(--sub); }
  #xmap .leaflet-bar a { background: var(--box); color: var(--fg); border-color: var(--line); backdrop-filter: blur(8px); }
  #xo { position: absolute; left: 0; right: 0; bottom: 0; z-index: 450; pointer-events: none; }
  .xpin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 8px rgba(0, 0, 0, .5); position: relative; }
  .xpin::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--c); opacity: 0; animation: xpulse 2.4s ease-out infinite; }
  @keyframes xpulse { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }
  .xico { font-size: 20px; line-height: 22px; text-align: center; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6)); }

  /* Map buttons below the tile name */
  #xctl { position: absolute; top: var(--mt); right: var(--ms); z-index: 1000; display: flex; gap: 6px; }
  #xctl button, .xbtn { color: var(--fg); border-radius: 18px; padding: 6px 12px; font-family: inherit; font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap; }
  #xctl .seg { display: flex; border-radius: 18px; overflow: hidden; }
  #xctl .seg button { border: 0; border-radius: 0; background: transparent; }
  #xctl button.on { background: var(--on); color: #fff; }

  /* Content inside the margins of the tile visualization */
  #xc { position: absolute; left: var(--ms); right: var(--ms); bottom: var(--mb); z-index: 1000; display: flex; flex-direction: column; gap: clamp(6px, 1.4cqh, 10px); }
  .xhero { display: flex; align-items: center; gap: clamp(10px, 2.5cqw, 20px); }
  .xring { width: clamp(64px, min(14cqw, 20cqh), 116px); height: auto; flex: none; }
  .xst { min-width: 0; flex: 1; }
  .xs { font-weight: 700; font-size: clamp(20px, min(5.5cqw, 8cqh), 42px); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xu { color: var(--sub); font-size: clamp(12px, min(2.4cqw, 3.6cqh), 15px); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xbtn { flex: none; display: flex; align-items: center; gap: 6px; font-size: clamp(12px, 2.2cqw, 14px); padding: 8px 14px; border-radius: 22px; }
  .xbtn svg, #xctl svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; vertical-align: -3px; }
  .xbtn:disabled { opacity: .65; cursor: default; }

  .xvs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(6px, 1.1cqh, 9px); }
  .xv { display: flex; align-items: center; gap: 10px; min-width: 0; border-radius: 12px; padding: clamp(6px, 1.2cqh, 10px) 12px; }
  .xv svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .xv div { display: flex; flex-direction: column; min-width: 0; }
  .xv span { color: var(--sub); font-size: clamp(10px, 1.8cqw, 12px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xv b { font-size: clamp(13px, 2.4cqw, 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xv i { font-style: normal; font-weight: 400; color: var(--sub); font-size: .85em; }
  .xv.wide { grid-column: 1 / -1; }
  @container (min-width: 620px) { .xvs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @container (min-width: 980px) { .xvs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @container (max-height: 460px) { .xv.opt { display: none; } }
  @container (max-height: 320px) { .xv.wide { display: none; } }
  @container (max-height: 230px) { .xvs { display: none; } }
  @container (max-width: 320px) { .xbtn span { display: none; } }

  /* History: picture in picture at the bottom right above the content, full view on click */
  #xh { position: absolute; z-index: 1001; border-radius: 14px; overflow: hidden; display: none; box-shadow: 0 6px 24px rgba(0, 0, 0, .45);
        border: 1px solid var(--line); background: var(--bg); transition: all .25s ease; }
  #xh iframe { width: 100%; height: 100%; border: 0; display: block; }
  #xh .cover { position: absolute; inset: 0; cursor: pointer; }
  #xh .lbl { position: absolute; left: 8px; bottom: 8px; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; pointer-events: none; }
  #xw.full #xh { left: var(--ms) !important; right: var(--ms) !important; top: var(--mt) !important; bottom: var(--mb) !important; width: auto !important; height: auto !important; }
  #xw.full #xh .cover, #xw.full #xh .lbl, #xw.full #xc, #xw.full #xctl { display: none; }

  #xe { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--sub); }
</style>
</head>
<body>
<div id="xw" class="vd">
  <div id="xmap"></div><div id="xo"></div>
  <div id="xctl"></div>
  <div id="xh"><iframe title="history"></iframe><div class="cover"></div><div class="lbl glass"></div></div>
  <div id="xc"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var T = %TEXTS%, THEME = %THEME%;
  var P = new URLSearchParams(location.search), W = document.getElementById('xw'), C = document.getElementById('xc'), H = document.getElementById('xh');
  var pending = 0, data = null, dark = true, sat = false, full = false, map = null, layers = {}, live = null, histSrc = '';
  var ICONS = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    pin: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    signal: '<path d="M2 9a15 15 0 0 1 20 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1"/>',
    target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    shield: '<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    route: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h8"/>',
    away: '<path d="M14 4a2 2 0 1 0 0 .1"/><path d="M9 21l2-6 3 3v3M7 12l3-3 3 2 3 1M10 9l1 5"/>',
    addr: '<path d="M4 6h16M4 12h16M4 18h10"/>',
    locate: '<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'
  };
  function color(n) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(n).replace(/[^0-9a-f]/gi, '');
    if (v.length < 6) { return null; }
    return v.length === 8 && /^ff/i.test(v) ? v.slice(2) : v.slice(0, 6);
  }
  function lum(h) { var c = parseInt(h, 16); return 0.299 * (c >> 16) + 0.587 * (c >> 8 & 255) + 0.114 * (c & 255); }
  function px(n, d) { var v = parseFloat(P.get(n)); return isNaN(v) ? d : v; }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function icon(n) { return '<svg viewBox="0 0 24 24">' + ICONS[n] + '</svg>'; }
  function hm(t) { var d = new Date(t * 1000); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function span(s) {
    if (s < 60) { return T.now; }
    return s < 3600 ? T.min.replace('%d', Math.floor(s / 60)) : s < 86400 ? T.h.replace('%d', Math.floor(s / 3600)) : T.d.replace('%d', Math.floor(s / 86400));
  }
  function age(t) { return t > 0 ? T.ago.replace('%s', span(Math.max(0, Math.floor(Date.now() / 1000) - t))) : ''; }
  function dist(a, b, c, d) {
    var r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r, h = Math.pow(Math.sin(x / 2), 2) + Math.cos(a * r) * Math.cos(c * r) * Math.pow(Math.sin(y / 2), 2);
    return 2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  function len(m) { return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', T.dec || ',') + ' km'; }
  function dauer(s) { var m = Math.round(s / 60), h = Math.floor(m / 60); return h ? h + ' h ' + ('0' + m % 60).slice(-2) + ' min' : m + ' min'; }

  // Design: colors passed by the tile visualization, otherwise device setting
  var cb = color('--card-color'), cf = color('--content-color');
  dark = THEME === 1 || (THEME === 0 && (cb ? lum(cb) < (cf ? lum(cf) : 128) : !matchMedia('(prefers-color-scheme: light)').matches));
  W.className = dark ? 'vd' : 'vl';
  if (THEME === 0 && cb) { W.style.setProperty('--bg', '#' + cb); }
  W.style.setProperty('--mt', Math.max(8, px('margintop', 12)) + 'px');
  W.style.setProperty('--ms', Math.max(10, px('marginside', 12)) + 'px');
  W.style.setProperty('--mb', Math.max(8, px('marginbottom', 12)) + 'px');
  try { sat = localStorage.getItem('xplTileSat') === '1'; } catch (e) {}

  // Statistics of today and "since" from the recorded locations
  function stats(d) {
    var r = { route: 0, away: 0, count: 0, since: 0 }, midnight = new Date().setHours(0, 0, 0, 0) / 1000, p = d.points;
    function out(q) { return dist(q[1], q[2], d.home[0], d.home[1]) > d.radius + Math.min(q[3] || 0, 200); }
    for (var i = 0; i < p.length; i++) {
      if (p[i][0] < midnight) { continue; }
      r.count++;
      if (i > 0 && p[i - 1][0] >= midnight) {
        if ((p[i - 1][3] || 0) <= 300 && (p[i][3] || 0) <= 300) { r.route += dist(p[i - 1][1], p[i - 1][2], p[i][1], p[i][2]); }
        if (d.home && out(p[i - 1])) { r.away += Math.min(p[i][0] - p[i - 1][0], 3600); }
      }
    }
    if (d.home && p.length && d.atHome !== null) {
      var j = p.length - 1;
      while (j > 0 && out(p[j - 1]) === !d.atHome) { j--; }
      if (j > 0) { r.since = p[j][0]; }
    }
    return r;
  }

  function ring(b, charging) {
    if (b === null || b === undefined) { return ''; }
    var r = 42, u = 2 * Math.PI * r, bc = b <= 20 ? '#e74c3c' : (b <= 40 ? '#f5a623' : '#2ecc71');
    return '<svg class="xring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="9"/>'
      + '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + bc + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + u.toFixed(1)
      + '" stroke-dashoffset="' + (u * (1 - b / 100)).toFixed(1) + '" transform="rotate(-90 50 50)"/>'
      + '<text x="50" y="49" text-anchor="middle" dominant-baseline="central" fill="var(--fg)" font-size="23" font-weight="700">' + b + '%</text>'
      + '<text x="50" y="70" text-anchor="middle" fill="var(--sub)" font-size="10">' + (charging ? '⚡ ' + esc(T.charging) : esc(T.battery)) + '</text></svg>';
  }

  function box(ic, label, value, cls, extra) {
    return '<div class="xv glass' + (cls ? ' ' + cls : '') + '">' + icon(ic) + '<div><span>' + esc(label) + '</span><b>' + esc(value) + (extra || '') + '</b></div></div>';
  }

  function render() {
    var d = data;
    if (!d) { return; }
    var e = document.getElementById('xe');
    if (d.empty) {
      C.innerHTML = '';
      if (!e) { W.insertAdjacentHTML('beforeend', '<div id="xe">' + esc(d.empty) + '</div>'); }
      return;
    }
    if (e) { e.remove(); }
    W.style.setProperty('--accent', d.color);
    var s = stats(d), busy = pending > Date.now();
    var sub = d.sub;
    if (s.since) { sub = (sub ? sub + ' · ' : '') + (d.atHome ? T.homeSince : T.awaySince).replace('%s', hm(s.since)); }
    var h = '<div class="xhero">' + ring(d.battery, d.charging) + '<div class="xst"><div class="xs" style="color:' + d.color + '">' + esc(d.status) + '</div>'
      + (sub ? '<div class="xu">' + esc(sub) + '</div>' : '') + '</div>'
      + '<button class="xbtn glass" id="xbtn"' + (busy ? ' disabled' : '') + '>' + icon('locate') + '<span>' + esc(busy ? T.pending : T.locate) + '</span></button></div>';
    h += '<div class="xvs">';
    var n = 0;
    d.values.forEach(function (v) {
      h += box(v[0], v[1], v[2], n++ >= 4 ? 'opt' : '', v[3] === 'age' ? ' <i class="xage">' + esc(age(d.time)) + '</i>' : '');
    });
    if (s.count) {
      h += box('route', T.route, len(s.route), n++ >= 4 ? 'opt' : '', ' <i>' + esc(T.locs.replace('%d', s.count)) + '</i>');
      if (d.home) { h += box('away', T.away, dauer(s.away), n++ >= 4 ? 'opt' : ''); }
    }
    if (d.address) { h += box('addr', T.address, d.address, 'wide'); }
    C.innerHTML = h + '</div>';
    document.getElementById('xbtn').onclick = function () {
      pending = Date.now() + 120000;
      this.disabled = true;
      this.querySelector('span').textContent = T.pending;
      requestAction('Locate', true);
    };
    controls();
    drawMap();
    history();
  }

  // Map type and "Center" buttons
  function controls() {
    var c = document.getElementById('xctl');
    c.innerHTML = '<div class="seg glass"><button id="bmap">' + esc(T.map) + '</button><button id="bsat">' + esc(T.sat) + '</button></div>'
      + '<button id="bctr" class="glass">' + icon('locate') + ' ' + esc(T.center) + '</button>';
    document.getElementById('bmap').className = sat ? '' : 'on';
    document.getElementById('bsat').className = sat ? 'on' : '';
    document.getElementById('bmap').onclick = function () { setLayer(false); };
    document.getElementById('bsat').onclick = function () { setLayer(true); };
    document.getElementById('bctr').onclick = center;
  }

  function setLayer(s) {
    sat = s;
    try { localStorage.setItem('xplTileSat', s ? '1' : '0'); } catch (e) {}
    if (map) {
      ['base', 'ref', 'img', 'lbl'].forEach(function (k) { map.removeLayer(layers[k]); });
      (s ? ['img', 'lbl'] : ['base', 'ref']).forEach(function (k) { layers[k].addTo(map); });
    }
    controls();
  }

  // Top of the content = lower end of the free map area
  function contentTop() { return W.clientHeight - C.offsetHeight - px('marginbottom', 12); }

  function center() {
    if (!map || !data || data.empty) { return; }
    var h = W.clientHeight, top = contentTop(), mt = px('margintop', 12) + 40;
    var y = Math.max(Math.min((mt + top) / 2, h * 0.5), Math.min(mt, h * 0.3));
    map.setView([data.lat, data.lng], map.getZoom() || 16, { animate: false });
    map.panBy([0, h / 2 - y], { animate: false });
  }

  function drawMap() {
    var d = data;
    if (typeof L === 'undefined') { return; }
    var esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    if (!map) {
      map = L.map('xmap', { zoomControl: true, scrollWheelZoom: false, attributionControl: true, zoomSnap: 0.5 }).setView([d.lat, d.lng], 16);
      var tone = dark ? 'Dark' : 'Light';
      layers.base = L.tileLayer(esri + 'Canvas/World_' + tone + '_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 16, maxZoom: 19, attribution: 'Esri, HERE, Garmin, © OpenStreetMap' });
      layers.ref = L.tileLayer(esri + 'Canvas/World_' + tone + '_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 16, maxZoom: 19 });
      layers.img = L.tileLayer(esri + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' });
      layers.lbl = L.tileLayer(esri + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
      setLayer(sat);
      live = L.layerGroup().addTo(map);
      window.addEventListener('resize', function () { map.invalidateSize(); fade(); placeHistory(); });
      setTimeout(function () { map.invalidateSize(); center(); }, 50);
    }
    live.clearLayers();
    var midnight = new Date().setHours(0, 0, 0, 0) / 1000, track = d.points.filter(function (p) { return p[0] >= midnight; }).map(function (p) { return [p[1], p[2]]; });
    if (track.length > 1) {
      L.polyline(track, { color: d.color, weight: 4, opacity: .55, dashArray: '1 7', lineCap: 'round' }).addTo(live);
      track.forEach(function (q) { L.circleMarker(q, { radius: 2.5, stroke: false, fillColor: d.color, fillOpacity: .7, interactive: false }).addTo(live); });
    }
    if (d.home) { L.marker(d.home, { icon: L.divIcon({ className: 'xico', html: '🏠', iconSize: [24, 24] }), interactive: false }).addTo(live); }
    if (d.place2) { L.marker(d.place2.pos, { icon: L.divIcon({ className: 'xico', html: '📍', iconSize: [24, 24], iconAnchor: [12, 22] }) }).bindTooltip(esc(d.place2.name)).addTo(live); }
    if (d.accuracy > 0) { L.circle([d.lat, d.lng], { radius: d.accuracy, color: d.color, weight: 1, opacity: .6, fillOpacity: .12, interactive: false }).addTo(live); }
    L.marker([d.lat, d.lng], { icon: L.divIcon({ className: '', html: '<div class="xpin" style="background:' + d.color + ';--c:' + d.color + '"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) })
      .bindTooltip(esc(d.name) + ' · ' + hm(d.time)).addTo(live);
    fade();
    // Follow the watch: center after a requested location, on the first draw and when the location left the visible area
    if (d.fresh || !drawMap.done || !map.getBounds().pad(-0.15).contains([d.lat, d.lng])) { drawMap.done = true; setTimeout(center, 60); }
  }

  function fade() {
    var o = document.getElementById('xo'), top = contentTop(), f = Math.max(40, Math.min(140, top * 0.35));
    o.style.top = (top - f) + 'px';
    o.style.background = 'linear-gradient(180deg, transparent 0, var(--bg) ' + f + 'px)';
  }

  // History of the instance (WebHook page) as picture in picture; full view on click
  function history() {
    if (!data.history) { H.style.display = 'none'; return; }
    var src = data.history + '&embed=1&th=' + (dark ? 'dark' : 'light');
    if (src !== histSrc) { histSrc = src; H.querySelector('iframe').src = src; }
    H.querySelector('.lbl').textContent = '⤢ ' + T.histToday;
    H.querySelector('.cover').onclick = function () { mode(true); };
    placeHistory();
  }
  function placeHistory() {
    if (!data || !data.history || full) { return; }
    var w = W.clientWidth, top = contentTop(), mt = px('margintop', 12) + 44;
    var pw = Math.min(Math.max(w * 0.3, 220), 420), ph = Math.min(Math.max((top - mt) * 0.55, 140), 280);
    var show = w >= 560 && top - mt >= ph + 10;
    H.style.display = show ? 'block' : 'none';
    H.style.width = pw + 'px';
    H.style.height = ph + 'px';
    H.style.right = 'var(--ms)';
    H.style.left = 'auto';
    H.style.top = (top - ph - 10) + 'px';
    H.style.bottom = 'auto';
  }
  function mode(f) {
    full = f;
    W.classList.toggle('full', f);
    var fr = H.querySelector('iframe').contentWindow;
    if (fr) { fr.postMessage({ xplora: 'mode', mode: f ? 'full' : 'mini' }, '*'); }
    if (!f) { placeHistory(); }
  }

  // Messages: data of the instance (string) or "back to live view" from the history page (object)
  window.handleMessage = function (raw) {
    if (raw && typeof raw === 'object') {
      if (raw.xplora === 'live') { mode(false); }
      return;
    }
    var d;
    try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || typeof d !== 'object') { return; }
    if (d.fresh) { pending = 0; }
    data = d;
    render();
  };
  setInterval(function () {
    var a = document.querySelector('.xage');
    if (a && data) { a.textContent = age(data.time); }
    if (pending && pending <= Date.now()) { pending = 0; render(); }
  }, 30000);
  handleMessage(%INITIAL%);
})();
</script>
</body>
</html>
