ll="#1a7f37" font-weight="bold" text-anchor="start">Anmeldung erfolgreich – Uhren: Lena</text><line x1="20" y1="384" x2="740" y2="384" stroke="#d0d7de"/><circle cx="30" cy="404" r="11" fill="#e8590c"/><text x="30" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="409" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Entweder E-Mail-Adresse ODER Ländervorwahl (ohne +) und Telefonnummer ohne führende 0 – so wie in der</text><text x="50" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Eltern-App.</text><circle cx="30" cy="446" r="11" fill="#e8590c"/><text x="30" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="50" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Passwort der Eltern-App. Es wird wie in der App nur als Prüfsumme gesendet.</text><circle cx="30" cy="471" r="11" fill="#e8590c"/><text x="30" y="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="50" y="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Nach dem Übernehmen testen: Die Uhren des Kontos werden aufgelistet.</text></svg>
