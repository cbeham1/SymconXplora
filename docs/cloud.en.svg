<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"><rect x="0.5" y="0.5" width="759" height="499" rx="10" fill="#ffffff" stroke="#d0d7de"/><path d="M0.5 10.5 a10 10 0 0 1 10 -10 h739 a10 10 0 0 1 10 10 v40 h-759 z" fill="#24323d"/><text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="start">Xplora Cloud</text><text x="740" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#9fb3c2" font-weight="normal" text-anchor="end">Xplora Cloud</text><text x="40" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#59636e" font-weight="normal" text-anchor="start">Login data of the Xplora parent app. Either e-mail address or country code and phone number.</text><circle cx="24" cy="98" r="11" fill="#e8590c"/><text x="24" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="40" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">E-mail address</text><rect x="40" y="102" width="680" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="121" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">parent@example.com</text><text x="40" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Country code</text><rect x="40" y="158" width="160" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="177" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start"></text><text x="214" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Phone number (without leading 0)</text><rect x="214" y="158" width="300" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="224" y="177" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start"></text><circle cx="24" cy="210" r="11" fill="#e8590c"/><text x="24" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="40" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Password</text><rect x="40" y="214" width="680" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="233" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">••••••••••••</text><text x="40" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Language</text><rect x="40" y="270" width="220" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="50" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">English</text><circle cx="24" cy="322" r="11" fill="#e8590c"/><text x="24" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><rect x="40" y="308" width="150" height="30" rx="4" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><text x="115" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">TEST CONNECTION</text><circle cx="47" cy="361" r="6" fill="#1a7f37"/><text x="60" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="start">Login successful – watches: Lena</text><line x1="20" y1="384" x2="740" y2="384" stroke="#d0d7de"/><circle cx="30" cy="404" r="11" fill="#e8590c"/><text x="30" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="409" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Either e-mail address OR country code (without +) and phone number without leading 0 – as in the</text><text x="50" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">parent app.</text><circle cx="30" cy="446" r="11" fill="#e8590c"/><text x="30" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="50" y="451" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Password of the parent app. Like the app it is only sent as a hash.</text><circle cx="30" cy="471" r="11" fill="#e8590c"/><text x="30" y="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="50" y="476" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Test after applying: the watches of the account are listed.</text></svg>
