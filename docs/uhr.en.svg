ke-width="1.2"/><path d="M44 577 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><text x="66" y="582" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Map of the location as background of the status tile (Esri)</text><rect x="40" y="597" width="16" height="16" rx="3" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><path d="M44 605 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><text x="66" y="610" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Create map variable (OpenStreetMap)</text><circle cx="24" cy="636" r="11" fill="#e8590c"/><text x="24" y="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><rect x="56" y="661" width="16" height="16" rx="3" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><path d="M60 669 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/><text x="82" y="674" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Record location history</text><text x="56" y="698" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start">Keep history for</text><rect x="56" y="704" width="200" height="28" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/><text x="66" y="723" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">30 days</text><rect x="40" y="622" width="680" height="124" rx="6" fill="none" stroke="#d0d7de" stroke-width="1.2"/><path d="M41 628 a5 5 0 0 1 5 -5 h668 a5 5 0 0 1 5 5 v24 h-678 z" fill="#eef3f6"/><text x="54" y="643" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="bold" text-anchor="start">▾  Location history</text><rect x="40" y="756" width="110" height="30" rx="4" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><text x="95" y="776" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">UPDATE NOW</text><rect x="160" y="756" width="248" height="30" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/><text x="284" y="776" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#00897b" font-weight="bold" text-anchor="middle">REQUEST LOCATION FROM WATCH</text><line x1="20" y1="802" x2="740" y2="802" stroke="#d0d7de"/><circle cx="30" cy="822" r="11" fill="#e8590c"/><text x="30" y="826" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="827" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Home: location of Symcon or own place/address. Creates "At home" and "Distance to home".</text><circle cx="30" cy="847" r="11" fill="#e8590c"/><text x="30" y="852" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="50" y="852" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Optional second place (school, work …): enter the address and "Find" – creates "At &lt;name&gt;" and the</text><text x="50" y="869" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">distance.</text><circle cx="30" cy="889" r="11" fill="#e8590c"/><text x="30" y="894" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="50" y="894" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Status tile or mini tile as HTML variable for the tile visualization.</text><circle cx="30" cy="914" r="11" fill="#e8590c"/><text x="30" y="918" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="50" y="919" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">History: places per day on a map with replay.</text></svg>
