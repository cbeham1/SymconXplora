erlauf</text><rect x="40" y="756" width="142" height="30" rx="4" fill="#00897b" stroke="#00897b" stroke-width="1.2"/><text x="111" y="776" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">JETZT ABFRAGEN</text><rect x="192" y="756" width="256" height="30" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="1.2"/><text x="320" y="776" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#00897b" font-weight="bold" text-anchor="middle">ORTUNG BEI DER UHR ANFORDERN</text><line x1="20" y1="802" x2="740" y2="802" stroke="#d0d7de"/><circle cx="30" cy="822" r="11" fill="#e8590c"/><text x="30" y="826" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="827" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Zuhause: Standort von Symcon oder eigener Ort/Adresse. Dann gibt es „Zu Hause“ und „Abstand zu</text><text x="50" y="844" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Hause“.</text><circle cx="30" cy="864" r="11" fill="#e8590c"/><text x="30" y="868" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="50" y="869" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Optional zweiter Ort (Schule, Arbeit …): Adresse eingeben und „Finden“ – erzeugt „Bei &lt;Name&gt;“ und den</text><text x="50" y="886" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Abstand.</text><circle cx="30" cy="906" r="11" fill="#e8590c"/><text x="30" y="910" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="50" y="911" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Statuskachel bzw. Mini-Kachel als HTML-Variable für die Kachel-Visualisierung.</text><circle cx="30" cy="931" r="11" fill="#e8590c"/><text x="30" y="936" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="50" y="936" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="normal" text-anchor="start">Verlauf: Orte je Tag auf einer Karte mit Wiedergabe.</text></svg>
